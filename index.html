<script>
        const ADMIN_PASSWORD = "daria";

        // KONFIGURACJA SUPABASE:
        const SUPABASE_URL = 'https://pykesrbrwvvxbyftbjoz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_to5aEQEHPjUjqmjIc33ulA_PgJqsjgD';
        
        let db = null;
        if(SUPABASE_URL && SUPABASE_ANON_KEY) {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let bookingState = {
            step: 1,
            selectedServiceName: 'Mały Tatuaż / Fineline',
            selectedPrice: 80,
            selectedDate: null,
            selectedTime: null
        };

        let appBookings = JSON.parse(localStorage.getItem('netjes_tattoo_bookings')) || [];

        const servicesData = {
            'small': { name: 'Mały Tatuaż / Fineline', price: 80 },
            'medium': { name: 'Średni Tatuaż / Detal', price: 160 }
        };

        const availableTimeSlots = ['10:00', '12:00', '14:30', '17:00'];

        /* NAWIGACJA I WALIDACJA */
        function goToStep(stepNum) {
            if (stepNum > bookingState.step) {
                if (bookingState.step === 2 && (!bookingState.selectedDate || !bookingState.selectedTime)) {
                    alert("Proszę wybrać dzień ORAZ godzinę!");
                    return;
                }
                if (bookingState.step === 3) {
                    const name = document.getElementById('input-client-name').value.trim();
                    const phone = document.getElementById('input-client-phone').value.trim();
                    const email = document.getElementById('input-client-email').value.trim();
                    const place = document.getElementById('input-body-placement').value.trim();
                    const desc = document.getElementById('input-description').value.trim();

                    if (!name || !phone || !email || !place || !desc) {
                        alert("Wypełnij wszystkie pola oznaczone gwiazdką (*)");
                        return;
                    }
                }
            }

            bookingState.step = stepNum;

            document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`step-content-${stepNum}`).classList.remove('hidden');

            for (let i = 1; i <= 4; i++) {
                const tab = document.getElementById(`step-tab-${i}`);
                const circle = document.getElementById(`step-circle-${i}`);
                const label = document.getElementById(`step-label-${i}`);

                if (i <= stepNum) {
                    tab.classList.remove('opacity-40');
                    tab.classList.add('opacity-100');
                    circle.className = "w-8 h-8 rounded-full gold-gradient-bg text-black font-bold flex items-center justify-center text-xs mb-1";
                    if(label) label.className = "text-[10px] uppercase tracking-wider font-semibold text-gold hidden sm:block";
                } else {
                    tab.classList.add('opacity-40');
                    tab.classList.remove('opacity-100');
                    circle.className = "w-8 h-8 rounded-full bg-dark-base border border-dark-border text-white font-bold flex items-center justify-center text-xs mb-1";
                    if(label) label.className = "text-[10px] uppercase tracking-wider font-medium text-gray-400 hidden sm:block";
                }
            }

            if (stepNum === 4) updateSummaryData();
        }

        /* WYBÓR USŁUGI */
        function selectService(key) {
            bookingState.selectedServiceName = servicesData[key].name;
            bookingState.selectedPrice = servicesData[key].price;

            document.querySelectorAll('.service-card').forEach(card => {
                card.className = "service-card p-5 rounded-xl border border-dark-border bg-dark-base cursor-pointer transition-all flex justify-between items-start";
            });

            document.getElementById(`service-card-${key}`).className = "service-card p-5 rounded-xl border border-gold bg-gold/10 cursor-pointer transition-all flex justify-between items-start";
        }

        /* KALENDARZ */
        function renderCalendar() {
            const grid = document.getElementById('calendar-days-grid');
            if(!grid) return;
            grid.innerHTML = '';

            for (let day = 1; day <= 31; day++) {
                const dateStr = `2026-10-${day < 10 ? '0' + day : day}`;
                const btn = document.createElement('button');
                btn.className = "calendar-day-btn h-10 w-full rounded-lg border border-dark-border text-xs text-white hover:border-gold transition flex items-center justify-center font-medium";
                btn.innerText = day;

                btn.onclick = () => {
                    bookingState.selectedDate = dateStr;
                    document.querySelectorAll('.calendar-day-btn').forEach(b => b.classList.remove('selected-day'));
                    btn.classList.add('selected-day');
                    document.getElementById('selected-date-display').innerText = `Wybrany dzień: ${dateStr}`;
                    renderTimeSlots();
                };
                grid.appendChild(btn);
            }
        }

        /* GODZINY */
        function renderTimeSlots() {
            const container = document.getElementById('time-slots-container');
            container.innerHTML = '';
            availableTimeSlots.forEach(time => {
                const slotBtn = document.createElement('button');
                slotBtn.className = 'time-slot-btn py-2.5 px-3 rounded-lg border border-dark-border text-xs text-white bg-dark-surface hover:border-gold';
                slotBtn.innerText = time;
                slotBtn.onclick = () => {
                    bookingState.selectedTime = time;
                    document.querySelectorAll('.time-slot-btn').forEach(b => b.classList.remove('selected-slot'));
                    slotBtn.classList.add('selected-slot');
                };
                container.appendChild(slotBtn);
            });
        }

        /* PODSUMOWANIE */
        function updateSummaryData() {
            document.getElementById('summary-service-title').innerText = bookingState.selectedServiceName;
            document.getElementById('summary-service-price').innerText = `€${bookingState.selectedPrice}`;
            document.getElementById('summary-datetime').innerText = `${bookingState.selectedDate} o godz. ${bookingState.selectedTime}`;
            document.getElementById('summary-client').innerText = document.getElementById('input-client-name').value;
            document.getElementById('summary-placement').innerText = document.getElementById('input-body-placement').value;
            document.getElementById('summary-contact').innerText = `${document.getElementById('input-client-phone').value} • ${document.getElementById('input-client-email').value}`;
        }

        /* FINALIZACJA I ZAPIS DO BAZY DANYCH (SUPABASE) */
        async function submitFinalBooking() {
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Zapisywanie...";
            submitBtn.disabled = true;

            const nameVal = document.getElementById('input-client-name').value;
            const emailVal = document.getElementById('input-client-email').value;
            const phoneVal = document.getElementById('input-client-phone').value;
            const placeVal = document.getElementById('input-body-placement').value;
            const descVal = document.getElementById('input-description').value;

            // Przygotowanie danych do Supabase (małe litery w nazwach kolumn)
            const payload = {
                clientname: nameVal,
                clientemail: emailVal,
                clientphone: phoneVal,
                service: bookingState.selectedServiceName,
                date: bookingState.selectedDate,
                time: bookingState.selectedTime,
                placement: placeVal,
                description: descVal
            };

            // Zapis do Supabase z informacją zwrotną o błędzie
            if (db) {
                const { data, error } = await db.from('bookings').insert([payload]);
                if (error) {
                    console.error("Błąd zapisywania w Supabase:", error);
                    alert("Błąd zapisu do bazy: " + error.message);
                } else {
                    alert("Dziękujemy! Rezerwacja została zapisana w bazie.");
                }
            } else {
                alert("Brak połączenia z bazą Supabase!");
            }

            // Kopia lokalna w przeglądarce
            const localBooking = {
                clientName: nameVal,
                clientEmail: emailVal,
                clientPhone: phoneVal,
                service: bookingState.selectedServiceName,
                date: bookingState.selectedDate,
                time: bookingState.selectedTime,
                placement: placeVal,
                description: descVal
            };
            appBookings.unshift(localBooking);
            localStorage.setItem('netjes_tattoo_bookings', JSON.stringify(appBookings));
            
            // Czyszczenie formularza i powrót
            bookingState.selectedDate = null;
            bookingState.selectedTime = null;
            document.getElementById('input-client-name').value = '';
            document.getElementById('input-client-phone').value = '';
            document.getElementById('input-client-email').value = '';
            document.getElementById('input-body-placement').value = '';
            document.getElementById('input-description').value = '';

            submitBtn.innerText = "Potwierdzam & Rezerwuję";
            submitBtn.disabled = false;

            goToStep(1);
            renderCalendar();
        }

        /* LOGIKA PANELU ADMINA /#admin */
        async function checkHashRoute() {
            if (window.location.hash === '#admin') {
                const pass = prompt("Podaj hasło do panelu Darii:");
                if (pass === ADMIN_PASSWORD) {
                    document.getElementById('client-view-container').classList.add('hidden');
                    document.getElementById('admin-view-container').classList.remove('hidden');
                    await fetchAndRenderBookings();
                } else {
                    alert("Nieprawidłowe hasło!");
                    window.location.hash = '';
                }
            } else {
                document.getElementById('admin-view-container').classList.add('hidden');
                document.getElementById('client-view-container').classList.remove('hidden');
            }
        }

        async function fetchAndRenderBookings() {
            if (db) {
                const { data, error } = await db.from('bookings').select('*').order('id', { ascending: false });
                if (!error && data) {
                    appBookings = data;
                }
            }
            renderAdminDashboard();
        }

        function renderAdminDashboard() {
            const tableBody = document.getElementById('admin-bookings-table-body');
            tableBody.innerHTML = '';
            if(!appBookings || appBookings.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Brak rezerwacji</td></tr>';
                return;
            }
            appBookings.forEach((b, index) => {
                const name = b.clientname || b.clientName || 'Brak danych';
                const email = b.clientemail || b.clientEmail || '';
                const phone = b.clientphone || b.clientPhone || '';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="p-4 font-bold text-white">${name}<br><span class="text-[10px] text-gray-500">${email} • ${phone}</span></td>
                    <td class="p-4 text-gold">${b.service}</td>
                    <td class="p-4">${b.date} (${b.time})</td>
                    <td class="p-4">${b.placement} - ${b.description}</td>
                    <td class="p-4 text-right">
                        <button onclick="deleteBooking(${b.id || index})" class="text-red-400 hover:text-white"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function deleteBooking(idOrIndex) {
            if (db && typeof idOrIndex === 'number' && idOrIndex > 100) {
                await db.from('bookings').delete().eq('id', idOrIndex);
            }
            appBookings.splice(typeof idOrIndex === 'number' && idOrIndex < 100 ? idOrIndex : 0, 1);
            localStorage.setItem('netjes_tattoo_bookings', JSON.stringify(appBookings));
            fetchAndRenderBookings();
        }

        window.addEventListener('hashchange', checkHashRoute);
        window.addEventListener('load', () => {
            renderCalendar();
            checkHashRoute();
        });
    </script>
